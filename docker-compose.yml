# Menjalankan infrastruktur saja. API dan worker dijalankan dengan `go run`.
# Jalankan: docker compose up -d
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"   # AMQP (dipakai aplikasi)
      - "15672:15672" # Dashboard: http://localhost:15672 (guest / guest)

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mongo
      - redis
      - rabbitmq
    restart: on-failure

volumes:
  mongo_data:
